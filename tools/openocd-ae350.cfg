# SPDX-License-Identifier: GPL-3.0-only
#
# OpenOCD for the AE350's A25 debug port on a core built with
# tang_phosphor_top's AE350_JTAG_PMOD0: PMOD0 pin 1 TCK, 2 TMS, 3 TDI, 4 TDO,
# 5 GND, wired to a Raspberry Pi Pico 2 running lonehog/JTAGprobe (CMSIS-DAP
# v2, TCK GP19, TMS GP14, TDI GP18, TDO GP21; Tang-PSX core-reference BRD-006).
#
#   openocd -f tools/openocd-ae350.cfg
#
# then, from telnet localhost 4444 or -c commands: halt, reg pc, reg, resume.
# The A25's TAP is a RISC-V debug transport module (IR length 5); its IDCODE
# is not asserted here so that the first connection reports it.

adapter driver cmsis-dap
cmsis_dap_vid_pid 0x2e8a 0x000c
transport select jtag
adapter speed 1000

jtag newtap a25 cpu -irlen 5
target create a25.cpu riscv -chain-position a25.cpu

# The debug module is reachable only while a core built this way is loaded.
# PMOD0 is not the FPGA's configuration JTAG (U1201), so the probe can stay
# connected while TinyTang reprograms the FPGA.
init
